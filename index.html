<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Class Buddy - Teacher Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Lexend -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f27f0d",
                        "background-light": "#f0f4f8", // Soft blue-tinted background as requested
                        "background-dark": "#1a1612",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Lexend', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-6 transition-colors duration-300">
    <!-- Main Container -->
    <div class="w-full max-w-md">
        <!-- Logo Section -->
        <div class="flex flex-col items-center mb-8">
            <div class="bg-primary text-white p-3 rounded-xl shadow-lg shadow-primary/20 mb-3">
                <span class="material-symbols-outlined text-4xl block">school</span>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">
                Class Buddy
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Manage your classroom with ease</p>
        </div>
        <!-- Login Card -->
        <div
            class="bg-white dark:bg-slate-900 rounded-xl shadow-2xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-800 p-8 md:p-10">
            <!-- Role Toggle Switch -->
            <div class="flex p-1.5 bg-slate-100 dark:bg-slate-800 rounded-full mb-8 relative">
                <!-- Active Indicator (Teacher State) -->
                <div
                    class="absolute inset-y-1.5 left-1.5 w-[calc(50%-6px)] bg-white dark:bg-slate-700 rounded-full shadow-sm transition-all duration-300 z-0">
                </div>
                <button
                    class="relative z-10 flex-1 flex items-center justify-center gap-2 py-2.5 text-sm font-semibold text-slate-900 dark:text-white transition-colors">
                    <span class="material-symbols-outlined text-lg">co_present</span>
                    Teacher
                </button>
                <button
                    class="relative z-10 flex-1 flex items-center justify-center gap-2 py-2.5 text-sm font-semibold text-slate-400 dark:text-slate-500 hover:text-slate-600 transition-colors">
                    <span class="material-symbols-outlined text-lg">face</span>
                    Student
                </button>
            </div>
            <!-- Welcome Message -->
            <div class="mb-8">
                <h2 class="text-xl font-bold text-slate-900 dark:text-white">Welcome back, Teacher!</h2>
                <p class="text-slate-500 dark:text-slate-400 text-sm">Please enter your credentials to access your
                    dashboard.</p>
            </div>
            <!-- Login Form -->
            <form action="#" class="space-y-5" method="POST">
                <!-- Email Field -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 ml-1" for="email">
                        Teacher Email
                    </label>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
                        <input
                            class="w-full pl-12 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl focus:ring-2 focus:ring-primary/50 text-slate-900 dark:text-white placeholder:text-slate-400 transition-all outline-none"
                            id="email" placeholder="e.g. professor@academy.edu" type="email" />
                    </div>
                </div>
                <!-- Password Field -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center ml-1">
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300" for="password">
                            Password
                        </label>
                        <a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
                        <input
                            class="w-full pl-12 pr-12 py-3.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl focus:ring-2 focus:ring-primary/50 text-slate-900 dark:text-white placeholder:text-slate-400 transition-all outline-none"
                            id="password" placeholder="••••••••" type="password" />
                        <button
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                            type="button">
                            <span class="material-symbols-outlined text-xl">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Remember Me -->
                <div class="flex items-center gap-2 px-1 py-1">
                    <input
                        class="rounded text-primary focus:ring-primary border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800"
                        id="remember" type="checkbox" />
                    <label class="text-sm text-slate-500 dark:text-slate-400 cursor-pointer" for="remember">Remember
                        this device</label>
                </div>
                <!-- Submit Button -->
                <button
                    class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-full shadow-lg shadow-primary/30 transition-all active:scale-[0.98] flex items-center justify-center gap-2"
                    type="submit">
                    Login to My Classroom
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>
            <!-- Footer Links -->
            <div class="mt-8 text-center">
                <p class="text-slate-500 dark:text-slate-400 text-sm">
                    Don't have a class yet?
                    <a class="text-primary font-bold hover:underline" href="#">Create an Account</a>
                </p>
            </div>
        </div>
        <!-- Help Link -->
        <div class="mt-8 text-center flex items-center justify-center gap-4 text-slate-400 dark:text-slate-600">
            <a class="text-xs hover:text-slate-600 dark:hover:text-slate-400 transition-colors" href="#">Help Center</a>
            <span class="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-700"></span>
            <a class="text-xs hover:text-slate-600 dark:hover:text-slate-400 transition-colors" href="#">Privacy
                Policy</a>
            <span class="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-700"></span>
            <a class="text-xs hover:text-slate-600 dark:hover:text-slate-400 transition-colors" href="#">Terms of
                Service</a>
        </div>
    </div>
</body>

</html>
